<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCR — Supply Chain Resilience Command Center</title>
<meta name="theme-color" content="#f4f4f2" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='1' y='1' width='46' height='46' rx='11' fill='%23fac400'/%3E%3Cpath d='M24 9.6 35.4 13.5v8c0 7.2-4.8 12.4-11.4 15.4-6.6-3-11.4-8.2-11.4-15.4v-8Z' fill='none' stroke='%23111013' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='17.3' r='2.6' fill='%23111013'/%3E%3Ccircle cx='18.4' cy='28.3' r='2.4' fill='%23111013'/%3E%3Ccircle cx='29.6' cy='28.3' r='2.4' fill='%23111013'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/guide.css" />
</head>
<body data-theme="light" data-shell="web">

<div class="shell">

  <!-- ======= Sidebar (floating glass pane, persona-mapped features) ======= -->
  <aside class="sidebar" id="sidebar">
    <div class="side-brand" data-hint="w-brand">
      <div class="brand-mark" aria-label="SCR">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="1" width="46" height="46" rx="11" fill="#fac400"/>
          <path d="M24 9.6 35.4 13.5v8c0 7.2-4.8 12.4-11.4 15.4-6.6-3-11.4-8.2-11.4-15.4v-8Z" fill="none" stroke="#111013" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M24 19.4v3.8M22.5 24.6l-3 2.3M25.5 24.6l3 2.3" stroke="#111013" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="17.3" r="2.4" fill="#111013"/>
          <circle cx="24" cy="23.9" r="1.8" fill="#111013"/>
          <circle cx="18.4" cy="28.3" r="2.2" fill="#111013"/>
          <circle cx="29.6" cy="28.3" r="2.2" fill="#111013"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Supply Chain Resilience</span>
        <span class="brand-cap">Command Center</span>
      </div>
    </div>
    <nav class="side-nav" id="nav"><!-- populated by app.js --></nav>
    <div class="side-foot" data-hint="w-agents-live">
      <span class="live-dot"></span>
      <span class="side-foot-text"><strong>Agents live</strong>Refreshed 10 Jul 2026 · 05:00 UTC</span>
    </div>
  </aside>

  <div class="main-col">
    <!-- ======= Toolbar (floats over the page; content scrolls beneath) ======= -->
    <header class="appbar">
      <button class="side-handle" id="sideToggle" title="Collapse sidebar" aria-label="Collapse sidebar" data-hint="w-side-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3.5"/><path d="M9.5 4.5v15"/><path d="M5.6 8.5h1.6M5.6 11.5h1.6"/></svg>
      </button>

      <!-- ======= Breadcrumb (window title) ======= -->
      <div class="crumbbar" id="crumbbar" data-hint="w-crumbs">
        <div class="crumb-trail" id="crumbTrail"></div>
      </div>

      <div class="appbar-right">
        <div class="global-search" data-hint="w-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="globalSearch" placeholder="Search or ask a question" autocomplete="off" />
          <kbd>/</kbd>
          <div class="search-results" id="searchResults"></div>
        </div>
        <button class="persona-pill" id="personaPill" title="Switch persona lens" data-hint="w-persona"><!-- populated by app.js --></button>
        <div class="tb-group">
          <button class="icon-btn guide-btn" id="guideBtn" data-guide-toggle="menu" data-hint="w-guide" aria-label="Guide" title="Guide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.86.83c0 1.66-2.46 2.2-2.46 3.6"/><path d="M12 16.9v.2"/></svg>
          </button>
          <a class="icon-btn" href="mobile.html" id="mobileLink" data-hint="w-mobile" aria-label="Open the mobile app" title="Mobile app">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.5 5.5h3"/><path d="M11.2 18.3h1.6"/></svg>
          </a>
          <div class="refresh-ic">
            <button class="icon-btn" aria-label="Data freshness" data-hint="w-refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
            <div class="refresh-tip">
              <strong>Weekly refresh</strong><br/>
              Last refreshed <strong>10-Jul-2026 05:00 UTC</strong><br/>
              Next full recalc 17-Jul-2026 · external risk feeds refresh daily at 03:00 UTC
            </div>
          </div>
          <button class="icon-btn" id="themeToggle" title="Toggle dark mode" data-hint="w-theme">
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="icon-btn" id="notifBtn" title="Alerts" data-hint="w-alerts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="notif-dot" id="notifDot"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="page" id="pageScroll">
      <div class="page-inner" id="page"><!-- routed pages render here --></div>
    </main>
  </div>

  <div class="notif-panel" id="notifPanel"><!-- populated by app.js --></div>
  <div class="persona-menu" id="personaMenu"><!-- populated by app.js --></div>
  <div class="guide-pop" id="guidePop"><!-- populated by app.js --></div>
</div>

<!-- ======= Detail drawer ======= -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-titles">
      <span class="drawer-kicker" id="drawerKicker"></span>
      <h2 id="drawerTitle"></h2>
    </div>
    <button class="icon-btn" id="drawerClose" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- ======= Copilot dock (FAB + floating glass panel) ======= -->
<button class="copilot-fab" id="copilotBtn" title="Resilience Copilot (⌘K)" data-hint="w-copilot">
  <span class="fab-dot"></span>
  <span class="fab-orb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 3.9 1.9 6.3 5.6 7.5-3.7 1.2-5.1 3.6-5.6 7.5-.5-3.9-1.9-6.3-5.6-7.5 3.7-1.2 5.1-3.6 5.6-7.5Z"/><path d="M18.6 14.2c.25 1.7.85 2.7 2.4 3.2-1.55.5-2.15 1.5-2.4 3.2-.25-1.7-.85-2.7-2.4-3.2 1.55-.5 2.15-1.5 2.4-3.2Z" opacity=".85"/></svg></span>
  <span class="fab-label">Ask Copilot</span>
  <span class="fab-kbd">⌘K</span>
</button>
<aside class="copilot" id="copilot" aria-label="Resilience Copilot">
  <div class="copilot-head">
    <div class="copilot-id">
      <div class="copilot-orb"></div>
      <div>
        <strong>Resilience Copilot</strong>
        <span id="copilotPersona">Natural-language resilience intelligence</span>
      </div>
    </div>
    <button class="icon-btn" id="copilotReset" title="New conversation" data-hint="w-cp-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="icon-btn" id="copilotClose" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="copilot-thread" id="copilotThread"></div>
  <div class="copilot-suggests" id="copilotSuggests" data-hint="w-cp-suggests"></div>
  <div class="copilot-context" id="copilotContext" data-hint="w-cp-context"></div>
  <form class="copilot-input" id="copilotForm" data-hint="w-cp-input">
    <input type="text" id="copilotText" placeholder="Ask about exposure, suppliers, what-ifs…" autocomplete="off" />
    <button type="submit" class="copilot-send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/></svg>
    </button>
  </form>
</aside>

<!-- ======= Modal ======= -->
<div class="modal-scrim" id="modalScrim">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="vendor/echarts.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/motion.js"></script>
<script src="js/personas.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/intelligence.js"></script>
<script src="js/copilot.js"></script>
<script src="js/pages/executive.js"></script>
<script src="js/pages/valuestream.js"></script>
<script src="js/pages/category.js"></script>
<script src="js/pages/site.js"></script>
<script src="js/pages/network.js"></script>
<script src="js/pages/scenario.js"></script>
<script src="js/pages/actions.js"></script>
<script src="js/pages/agents.js"></script>
<script src="js/pages/quality.js"></script>
<script src="js/guide.js"></script>
<script src="js/app.js"></script>
</body>
</html>
